worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 256; }
http {
    access_log logs/access.log;
    upstream team_backends {
        zone team_backends 128k;
        server 10.7.25.239:3001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=10s;
    }
    server {
        listen 8080;
        server_name app.team1.test api.team1.test;
        return 301 https://$host:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;
        ssl_certificate certs/standby.crt;
        ssl_certificate_key certs/standby.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://team_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 8s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            add_header X-Edge mac4 always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }
}
