# Redacted reference: addresses, upstream ports, hostnames and paths are examples.
upstream team_backends {
    zone team_backends 256k;
    server 192.0.2.10:9001 max_fails=1 fail_timeout=10s;
    server 192.0.2.20:9002 max_fails=1 fail_timeout=10s;
}

server {
    listen 8080 default_server;
    server_name app.example.test api.example.test;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name app.example.test api.example.test;
    ssl_certificate     /path/to/certs/app.crt;
    ssl_certificate_key /path/to/certs/app.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /path/to/logs/phase2-main-access.log;
    error_log  /path/to/logs/phase2-main-error.log info;

    location / {
        proxy_pass http://team_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 8s;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        add_header X-Edge mac2 always;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
    }
}
